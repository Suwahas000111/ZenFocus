name: Build ZenFocus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show repository files
        run: ls -la

      - name: Extract project
        run: unzip -q ZenFocus_Hybrid_Original_UI.zip -d extracted

      - name: Find Gradle project
        run: find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
